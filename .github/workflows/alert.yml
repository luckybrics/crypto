name: run-alert

on:
  schedule:
    - cron: "*/20 * * * *"   # CADANGAN - cron-job.org yang jadi pemicu utama (tiap 10 menit)
  workflow_dispatch: {}       # dipakai cron-job.org buat trigger, DAN bisa juga di-trigger manual dari tab Actions

# Hanya 1 run yang boleh jalan dalam satu waktu. Tanpa ini, cron-job.org dan
# cron GitHub bisa jalan bersamaan dan saling menimpa state di Gist.
# cancel-in-progress: false -> run yang baru menunggu, tidak membatalkan run yang sedang jalan.
concurrency:
  group: run-alert
  cancel-in-progress: false

# TIDAK ADA "permissions: contents: write" dan TIDAK ADA step git commit/push.
# Workflow ini tidak pernah menulis ke repo. State disimpan di GitHub Gist
# lewat API (dari dalam crypto_alert.py). Source code cuma DIBACA dari repo private.

jobs:
  run-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Source code dari repo PRIVATE, pakai token khusus (read-only di repo).
      - name: Ambil source code dari repo private
        uses: actions/checkout@v4
        with:
          repository: luckybrics/crypto-alert-bot
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r private-src/requirements.txt

      - name: Run alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_GIST_ID: ${{ secrets.STATE_GIST_ID }}
          STATE_GIST_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: python private-src/crypto_alert.py
